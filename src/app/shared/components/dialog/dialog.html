<div class="dialog-wrapper" [class.success]="data.isSuccess" [class.error]="!data.isSuccess">
  <h2 mat-dialog-title>{{ data.title }}</h2>
  <mat-dialog-content>
    <p>{{ data.message }}</p>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close class="dialog-ok-btn">OK</button>
  </mat-dialog-actions>
</div>
